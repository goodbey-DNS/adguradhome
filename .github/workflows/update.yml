name: AdGuardHome Sync
on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  OFFICIAL_REPO: AdguardTeam/AdGuardHome

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Get latest version
        id: version
        run: |
          VERSION=$(curl -s "https://api.github.com/repos/${{ env.OFFICIAL_REPO }}/releases/latest" | jq -r '.tag_name')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Latest: $VERSION"

      - name: Download all architectures
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BASE="https://github.com/${{ env.OFFICIAL_REPO }}/releases/download/${VERSION}"

          # 下载各架构文件
          for arch in linux_amd64 linux_arm64 linux_armv7; do
            curl -L -o "AdGuardHome_${arch}.tar.gz" "${BASE}/AdGuardHome_${arch}.tar.gz" || true
          done

          ls -la *.tar.gz 2>/dev/null || echo "No files downloaded"

      - name: Generate OpenWrt download script
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cat > download.sh << 'EOF'
          #!/bin/sh
          # AdGuardHome OpenWrt 自动下载脚本
          # 自动识别架构并下载对应文件

          VERSION="VERSION_PLACEHOLDER"
          REPO="goodbey-DNS/adguradhome"

          # OpenWrt 架构映射
          get_arch() {
            local arch
            arch=$(uname -m 2>/dev/null || echo "unknown")

            case "$arch" in
              x86_64)    echo "linux_amd64" ;;
              aarch64)   echo "linux_arm64" ;;
              armv8*)    echo "linux_arm64" ;;
              armv7l)    echo "linux_armv7" ;;
              armv7*)    echo "linux_armv7" ;;
              armv6*)    echo "linux_armv7" ;;
              mips*)     echo "unsupported" ;;
              *)         echo "unknown" ;;
            esac
          }

          ARCH=$(get_arch)

          if [ "$ARCH" = "unsupported" ] || [ "$ARCH" = "unknown" ]; then
            echo "错误: 不支持的架构 ($(uname -m))"
            echo "支持的架构: x86_64, aarch64, armv7"
            exit 1
          fi

          FILE="AdGuardHome_${ARCH}.tar.gz"

          # 从本仓库下载（支持 ghproxy 加速）
          URL="https://github.com/${REPO}/releases/download/v-latest/${FILE}"

          # 检测是否使用 ghproxy（默认使用）
          USE_PROXY="${USE_GHPROXY:-true}"
          if [ "$USE_PROXY" = "true" ]; then
            URL="https://ghproxy.net/${URL}"
          fi

          echo "================================"
          echo "AdGuardHome v${VERSION}"
          echo "架构: ${ARCH}"
          echo "下载: ${URL}"
          echo "================================"

          wget -O "$FILE" "$URL" || curl -L -o "$FILE" "$URL"

          if [ -f "$FILE" ]; then
            echo ""
            echo "✓ 下载完成: $FILE"
            echo ""
            echo "解压并安装:"
            echo "  tar -xzf $FILE"
            echo "  cd AdGuardHome"
            echo "  ./AdGuardHome -s install"
          else
            echo "✗ 下载失败"
            exit 1
          fi
          EOF

          # 替换版本号
          sed -i "s/VERSION_PLACEHOLDER/${VERSION}/g" download.sh
          chmod +x download.sh

      - name: Publish release
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # 删除旧 release
          gh release delete v-latest --yes --cleanup-tag 2>/dev/null || true

          # 创建新 release
          gh release create v-latest \
            --title "AdGuardHome ${VERSION}" \
            --notes "同步自官方仓库

## 一键下载（自动识别架构）

\`\`\`bash
# 使用 ghproxy 加速（推荐）
wget -O- https://ghproxy.net/https://github.com/${{ github.repository }}/releases/download/v-latest/download.sh | sh

# 或直接执行
curl -L https://ghproxy.net/https://github.com/${{ github.repository }}/releases/download/v-latest/download.sh | sh
\`\`\`

## 手动下载

| 架构 | 下载链接 |
|------|---------|
| x86_64 | [AdGuardHome_linux_amd64.tar.gz](https://ghproxy.net/https://github.com/${{ github.repository }}/releases/download/v-latest/AdGuardHome_linux_amd64.tar.gz) |
| arm64/aarch64 | [AdGuardHome_linux_arm64.tar.gz](https://ghproxy.net/https://github.com/${{ github.repository }}/releases/download/v-latest/AdGuardHome_linux_arm64.tar.gz) |
| armv7 | [AdGuardHome_linux_armv7.tar.gz](https://ghproxy.net/https://github.com/${{ github.repository }}/releases/download/v-latest/AdGuardHome_linux_armv7.tar.gz) |" \
            *.tar.gz download.sh 2>/dev/null || \
          gh release create v-latest \
            --title "AdGuardHome ${VERSION}" \
            --notes "同步自官方仓库" \
            download.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
